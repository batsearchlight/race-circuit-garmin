name: Build release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to rebuild
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Venu 3 app
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      SDK_MANAGER_VERSION: 0.8.4
      SDK_MANAGER_SHA256: 5d57b8f9cfcd02d3b3f48e19d6daca0480e4c6f627926f15d8617ef8a6f57e0b
      CONNECT_IQ_SDK_VERSION: 9.2.0
      GARMIN_AGREEMENT_HASH: CC737BBBA104D7740D5BBCF27D0F6382

    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the Connect IQ command-line SDK manager
        shell: bash
        run: |
          archive="$RUNNER_TEMP/connect-iq-sdk-manager.tar.gz"
          install_dir="$RUNNER_TEMP/connect-iq-sdk-manager"
          url="https://github.com/lindell/connect-iq-sdk-manager-cli/releases/download/v${SDK_MANAGER_VERSION}/connect-iq-sdk-manager-cli_${SDK_MANAGER_VERSION}_Linux_x86_64.tar.gz"

          curl --fail --location --silent --show-error "$url" --output "$archive"
          echo "${SDK_MANAGER_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir --parents "$install_dir"
          tar --extract --gzip --file "$archive" --directory "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Install Connect IQ SDK and Venu 3 device files
        shell: bash
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          if [[ -z "$GARMIN_USERNAME" || -z "$GARMIN_PASSWORD" ]]; then
            echo "Missing GARMIN_USERNAME or GARMIN_PASSWORD repository secret." >&2
            exit 1
          fi

          connect-iq-sdk-manager agreement accept --agreement-hash "$GARMIN_AGREEMENT_HASH"
          connect-iq-sdk-manager login
          connect-iq-sdk-manager sdk set "$CONNECT_IQ_SDK_VERSION"
          connect-iq-sdk-manager device download --device venu3

          sdk_bin="$(connect-iq-sdk-manager sdk current-path --bin)"
          echo "$sdk_bin" >> "$GITHUB_PATH"

      - name: Prepare signing key
        shell: bash
        env:
          DEVELOPER_KEY_BASE64: ${{ secrets.CONNECTIQ_DEVELOPER_KEY_BASE64 }}
        run: |
          key="$RUNNER_TEMP/developer_key.der"

          if [[ -n "$DEVELOPER_KEY_BASE64" ]]; then
            printf '%s' "$DEVELOPER_KEY_BASE64" | base64 --decode > "$key"
          else
            openssl genrsa -out "$RUNNER_TEMP/developer_key.pem" 4096
            openssl pkcs8 -topk8 -inform PEM -outform DER \
              -in "$RUNNER_TEMP/developer_key.pem" \
              -out "$key" \
              -nocrypt
            echo "CONNECTIQ_DEVELOPER_KEY_BASE64 is not set; this release uses an ephemeral signing key." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "DEVELOPER_KEY=$key" >> "$GITHUB_ENV"

      - name: Build release PRG
        shell: bash
        run: |
          mkdir --parents dist
          monkeyc \
            -d venu3 \
            -f monkey.jungle \
            -o dist/RaceCircuit-Venu3.prg \
            -y "$DEVELOPER_KEY" \
            -r \
            -O 2 \
            -l 1 \
            -w

          sha256sum dist/RaceCircuit-Venu3.prg > dist/SHA256SUMS.txt
          test -s dist/RaceCircuit-Venu3.prg

      - name: Attach downloads to the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/RaceCircuit-Venu3.prg \
            dist/SHA256SUMS.txt \
            --clobber

          echo "### Release downloads" >> "$GITHUB_STEP_SUMMARY"
          echo "- RaceCircuit-Venu3.prg" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA256SUMS.txt" >> "$GITHUB_STEP_SUMMARY"
