name: Build release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to rebuild
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.watch_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - device_id: venu3
            watch_name: Venu 3
            artifact_name: RaceCircuit-Venu3.prg
          - device_id: venu3s
            watch_name: Venu 3S
            artifact_name: RaceCircuit-Venu3S.prg
          - device_id: fr265
            watch_name: Forerunner 265
            artifact_name: RaceCircuit-Forerunner265.prg
          - device_id: fr265s
            watch_name: Forerunner 265S
            artifact_name: RaceCircuit-Forerunner265S.prg
          - device_id: fr965
            watch_name: Forerunner 965
            artifact_name: RaceCircuit-Forerunner965.prg
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      DEVICE_ID: ${{ matrix.device_id }}
      WATCH_NAME: ${{ matrix.watch_name }}
      ARTIFACT_NAME: ${{ matrix.artifact_name }}
      SDK_MANAGER_VERSION: 0.8.4
      SDK_MANAGER_SHA256: 5d57b8f9cfcd02d3b3f48e19d6daca0480e4c6f627926f15d8617ef8a6f57e0b
      CONNECT_IQ_SDK_VERSION: 9.2.0
      GARMIN_AGREEMENT_HASH: CC737BBBA104D7740D5BBCF27D0F6382

    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the Connect IQ command-line SDK manager
        shell: bash
        run: |
          archive="$RUNNER_TEMP/connect-iq-sdk-manager.tar.gz"
          install_dir="$RUNNER_TEMP/connect-iq-sdk-manager"
          url="https://github.com/lindell/connect-iq-sdk-manager-cli/releases/download/v${SDK_MANAGER_VERSION}/connect-iq-sdk-manager-cli_${SDK_MANAGER_VERSION}_Linux_x86_64.tar.gz"

          curl --fail --location --silent --show-error "$url" --output "$archive"
          echo "${SDK_MANAGER_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir --parents "$install_dir"
          tar --extract --gzip --file "$archive" --directory "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Install Connect IQ SDK and device files
        shell: bash
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          if [[ -z "$GARMIN_USERNAME" || -z "$GARMIN_PASSWORD" ]]; then
            echo "Missing GARMIN_USERNAME or GARMIN_PASSWORD repository secret." >&2
            exit 1
          fi

          connect-iq-sdk-manager agreement accept --agreement-hash "$GARMIN_AGREEMENT_HASH"
          connect-iq-sdk-manager login
          connect-iq-sdk-manager sdk set "$CONNECT_IQ_SDK_VERSION"
          connect-iq-sdk-manager device download --device "$DEVICE_ID"

          sdk_bin="$(connect-iq-sdk-manager sdk current-path --bin)"
          echo "$sdk_bin" >> "$GITHUB_PATH"

      - name: Prepare signing key
        shell: bash
        env:
          DEVELOPER_KEY_BASE64: ${{ secrets.CONNECTIQ_DEVELOPER_KEY_BASE64 }}
        run: |
          key="$RUNNER_TEMP/developer_key.der"

          if [[ -z "$DEVELOPER_KEY_BASE64" ]]; then
            echo "Missing release signing key repository secret." >&2
            exit 1
          fi

          printf '%s' "$DEVELOPER_KEY_BASE64" | base64 --decode > "$key"
          test -s "$key"

          echo "DEVELOPER_KEY=$key" >> "$GITHUB_ENV"

      - name: Build release PRG
        shell: bash
        run: |
          mkdir --parents dist
          monkeyc \
            -d "$DEVICE_ID" \
            -f monkey.jungle \
            -o "dist/$ARTIFACT_NAME" \
            -y "$DEVELOPER_KEY" \
            -r \
            -O 2 \
            -l 1 \
            -w

          checksum_name="${ARTIFACT_NAME}.sha256"
          (
            cd dist
            sha256sum "$ARTIFACT_NAME" > "$checksum_name"
          )
          test -s "dist/$ARTIFACT_NAME"
          echo "CHECKSUM_NAME=$checksum_name" >> "$GITHUB_ENV"

      - name: Attach downloads to the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "dist/$ARTIFACT_NAME" \
            "dist/$CHECKSUM_NAME" \
            --clobber

          echo "### $WATCH_NAME release download" >> "$GITHUB_STEP_SUMMARY"
          echo "- $ARTIFACT_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- $CHECKSUM_NAME" >> "$GITHUB_STEP_SUMMARY"
